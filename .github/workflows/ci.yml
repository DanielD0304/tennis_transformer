name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          # CPU-Variante von torch (die Standard-Wheels ziehen CUDA mit, mehrere GB)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest

      - name: Syntax-Check
        run: python -m compileall -q src betscraper main.py preprocess_data.py

      - name: Django-Check
        working-directory: betscraper
        run: python manage.py check

      - name: Tests
        run: python -m pytest -v
