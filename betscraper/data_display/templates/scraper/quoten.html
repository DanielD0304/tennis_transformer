<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data</title>
</head>
<body>
    <h1>Data</h1>
    <ul>
        {% for game in games %}
            <li>{{ game.team1.name }} - {{ game.team1.odd }} | Draw: {{ game.draw.odd }} | {{ game.team2.name }} - {{ game.team2.odd }}</li>
        {% endfor %}
    </ul>
</body>
</html>
